name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stayboard
          POSTGRES_PASSWORD: stayboard
          POSTGRES_DB: stayboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://stayboard:stayboard@localhost:5432/stayboard_test
      # Skip Clerk + Stripe at test time — both are opt-in via env presence
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ""
      CLERK_SECRET_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      # The postgres image's POSTGRES_USER (stayboard) is the bootstrap
      # SUPERUSER, and superusers BYPASS row-level security even with FORCE —
      # its SUPERUSER attribute also can't be removed. Production connects as a
      # non-superuser, so create a dedicated app role and run seed + tests as
      # it; otherwise the RLS tenant-guard tests would silently no-op.
      # Migrations stay as the owner (stayboard) so the tables are owned there.
      - name: Create non-superuser app role for RLS
        run: |
          psql "$DATABASE_URL" <<'SQL'
          DROP ROLE IF EXISTS app_rls;
          CREATE ROLE app_rls LOGIN PASSWORD 'app_rls';
          GRANT USAGE ON SCHEMA public TO app_rls;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO app_rls;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO app_rls;
          SQL

      - name: Seed database
        run: npm run db:seed
        env:
          DATABASE_URL: postgresql://app_rls:app_rls@localhost:5432/stayboard_test

      - name: Lint + type-check (via build)
        run: npm run build

      - name: Run Vitest suite with coverage
        run: npm run test:coverage
        env:
          DATABASE_URL: postgresql://app_rls:app_rls@localhost:5432/stayboard_test

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: test-results/junit.xml
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/lcov.info
            coverage/index.html
            coverage/
          if-no-files-found: ignore

  visual:
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stayboard
          POSTGRES_PASSWORD: stayboard
          POSTGRES_DB: stayboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://stayboard:stayboard@localhost:5432/stayboard_test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client + migrate + seed
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run db:seed

      - name: Run visual regression
        run: npm run test:visual

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            e2e-results/
          if-no-files-found: ignore
