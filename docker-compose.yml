services:
  postgres:
    image: postgres:16-alpine
    container_name: stayboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stayboard
      POSTGRES_PASSWORD: stayboard
      POSTGRES_DB: stayboard
    ports:
      - "5432:5432"
    volumes:
      - stayboard-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayboard -d stayboard"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  stayboard-pg:
